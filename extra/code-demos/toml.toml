# Cargo-style TOML
[package]
name = "nushu"
version = "0.1.0"
edition = "2021"
authors = ["wheredoesyourmindgo"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "palette"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
debug = false
released = 2026-10-22T09:00:00Z
literal = 'C:\no\escapes'
multiline = """
Two
lines"""
